random_seed: 42

# --- DATA PATHS ---
paths:
  engineered_csv: "data/processed/AT_engineered.csv"
  interim_dir: "data/interim_weather_full"
  checkpoints_dir: "checkpoints_weather_full"
  outputs_dir: "outputs_weather_full"
  windows_npz: "data/interim_weather_full/windows.npz"

# --- TIME SPLITS (15-min dataset intersection) ---
time:
  tz_output: "UTC"
  split:
    train_until: "2024-06-30 23:45:00"
    val_until:   "2024-09-30 23:45:00"
    test_until:  "2024-12-31 23:45:00"

# --- COLUMN MAPPING ---
columns:
  timestamp: "Time (UTC)"
  holiday_flags: ["is_public_holiday","is_weekend","is_special_day"]

# --- FEATURES ---
features:
  # 15-min intervals: 168 hours * 4 = 672
  context_hours: 672
  # 15-min intervals: 12 hours * 4 = 48
  horizon_hours: 48
  
  # Input features (Drivers)
  input_features: [
    "hour_sin", "hour_cos", "dow_sin", "dow_cos", "month_sin", "month_cos",
    "holiday",
    "temperature_2m_C", "precipitation_mm", "mean_global_radiation", "mean_wind_speed"
  ]

  # Target features (What we are predicting!)
  target_features: [
    "temperature_2m_C", 
    "precipitation_mm",
    "mean_global_radiation",
    "mean_wind_speed"
  ]

# ... Keep the rest of the file (training, elm, etc.) exactly as it is ...

training:
  encoder:
    latent_channels: 128
    lr: 0.001
    batch_size: 128
    epochs: 20
    price_loss_weight: 1.0 
  elm:
    hidden: 2048           # Increased from 1024 to capture complex spikes
    ridge_lambda: 0.001 # 1e-3. CRITICAL: Lowers the "smoothing" penalty so it fits peaks.
    weight_scale: 0.05      # Lowered from 0.5. Matches your normalized inputs (Std=1).
    bias_scale: 0.05        # Lowered from 0.5.
    ensemble: 1

# --- ASP SETTINGS ---
# We need this to force Radiation to 0 at night
asp:
  program: "src/asp/weather_physics.lp"
  night_hours: [0,1,2,3,4,21,22,23]
  batch_size: 10
  scale: 100
  target_map:
    temperature_2m_C: temp
    relative_humidity_2m_pct: hum
    "wind_speed_100m (m/s)": wind
    surface_pressure_hPa: press
    shortwave_radiation_Wm2: rad
    precipitation_mm: precip
