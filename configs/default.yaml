random_seed: 42
# --- shim keys used by YOUR preprocess scripts ---
data_path: "data"
# Add your new raw files here:
raw_weather_csv: "data/raw/weather_data_15min.csv" 
raw_energy_csv: "data/raw/gen_dataset.csv"
holidays_csv: "data/AT_public_holidays_2020_2025.csv"
engineered_csv: "data/processed/AT_engineered.csv"

paths:
  engineered_csv: "data/processed/AT_engineered.csv"
  interim_dir: "data/interim"
  processed_dir: "data/processed"
  checkpoints_dir: "checkpoints"
  outputs_dir: "outputs"
  windows_npz: "data/interim/windows_dcenn.npz"
  
time:
  tz_output: "UTC"
  split:
    # Adjust to fit within your 2023-01-01 to 2024-12-31 overlap
    train_until: "2024-06-30 23:45:00"
    val_until:   "2024-09-30 23:45:00"
    test_until:  "2024-12-31 23:45:00"

# Map your new headers
columns:
  timestamp: "Time (UTC)"
  load_mw: "load" 
  holiday_flags: ["is_public_holiday","is_weekend","is_special_day"]

features:
  # Adjusted for 15-min intervals (168 hours * 4 = 672 steps)
  context_hours: 672 
  # Adjusted for 15-min intervals (12 hours * 4 = 48 steps)
  horizon_hours: 48  
  scale_targets: false

training:
  encoder:
    latent_channels: 256
    lr: 0.001
    batch_size: 128
    epochs: 40
    price_loss_weight: 4.0
  elm:
    hidden: 2048
    ridge_lambda: 1e-4
    ensemble: 5

eval:
  spike_quantile: 0.9

asp:
  ramp_percentile: 0.99
  pv_night_hours: [0,1,2,3,4,21,22,23]
  
  

