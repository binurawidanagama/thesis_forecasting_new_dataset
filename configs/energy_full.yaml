random_seed: 42

paths:
  engineered_csv: "data/processed/AT_engineered.csv"
  interim_dir: "data/interim_energy_full"
  checkpoints_dir: "checkpoints_energy_full"
  outputs_dir: "outputs_energy_full"
  windows_npz: "data/interim_energy_full/windows.npz"

# Aligned with the 2023-2024 intersection for your new dataset
time:
  tz_output: "UTC"
  split:
    train_until: "2024-06-30 23:45:00"
    val_until:   "2024-09-30 23:45:00"
    test_until:  "2024-12-31 23:45:00"

# Removed solar/wind capacity references
columns:
  timestamp: "Time (UTC)"
  holiday_flags: ["is_public_holiday","is_weekend","is_special_day"]

features:
  # 15-min intervals: 168 hours * 4 = 672
  context_hours: 672
  # 15-min intervals: 12 hours * 4 = 48
  horizon_hours: 48

  # Removed old features; added 4 weather features + load
  input_features: [
    "hour_sin", "hour_cos",
    "dow_sin", "dow_cos",
    "month_sin", "month_cos",
    "is_weekend", "is_public_holiday", "is_special_day",
    
    "temperature_2m_C", "precipitation_mm",
    "mean_global_radiation", "mean_wind_speed",
    "load_mw"
  ]

  # Set to empty because we no longer have static wind/solar capacities
  static_features: []

  # We are ONLY predicting load
  target_features: ["load_mw"]

scaling:
  type: standard

training:
  encoder:
    latent_channels: 128
    lr: 0.0001
    batch_size: 128
    epochs: 20
  elm:
    hidden: 1024
    ridge_lambda: 1e-3
    ensemble: 1

asp:
  solar_night_hours: [0,1,2,3,4,21,22,23]
  program: "src/asp/energy_physics.lp"
  target_map:
    load_mw: "load"